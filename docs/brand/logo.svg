<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Open Job Copilot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2350"/>
      <stop offset="1" stop-color="#090B1C"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6D7CFF"/>
      <stop offset="1" stop-color="#34E0C4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#34E0C4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#34E0C4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <!-- open ring: the "O" of Open, with a gap the application flies through -->
  <circle cx="256" cy="264" r="128" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"
          stroke-dasharray="676 128" transform="rotate(-22 256 264)"/>
  <!-- paper plane = the application being sent -->
  <g stroke-linejoin="round" stroke-width="12">
    <polygon points="384,132 200,238 262,270" fill="#FFFFFF" stroke="#FFFFFF"/>
    <polygon points="384,132 262,270 296,336" fill="#B9C3FF" stroke="#B9C3FF"/>
  </g>
</svg>
